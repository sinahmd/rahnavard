name: CI - Lint & Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan tracked files for secrets
        run: |
          echo "🔒 Scanning tracked files for secrets..."
          bash scripts/scan-secrets.sh

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — gitleaks scans every commit

      - name: Install gitleaks (pinned)
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan the full git history
        run: /tmp/gitleaks detect --source . --log-opts="--all" --redact --no-banner --exit-code 1

  check-local-only:
    name: Check Local-Only Files
    runs-on: ubuntu-latest
    # Only run on PRs to main — this is the gate that blocks bad merges
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for diff

      - name: Check for local-only files in PR diff
        run: |
          echo "🔍 Checking for local-only files in PR..."
          bash scripts/check-local-only.sh "origin/main...HEAD"

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test -- --coverage --watchAll=false

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        working-directory: backend
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: '1'
          DATABASE_URL: sqlite:///test.db
        run: python manage.py check

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: '1'
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
        run: pytest --cov=apps --cov-report=term-missing

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://rahnavard.co/api/v1
          NEXT_PUBLIC_SITE_URL: https://rahnavard.co
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check backend
        working-directory: backend
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: '1'
          DATABASE_URL: sqlite:///test.db
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

  e2e:
    name: E2E (Playwright, Docker stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Full-stack e2e is too slow for every develop push: it gates the
    # production path — PRs to main, pushes to main, and manual dispatch.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start PostgreSQL and wait for it
        run: |
          docker compose up -d --build postgres
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U user && exit 0
            sleep 2
          done
          echo "postgres never became ready"
          docker compose logs --tail=50 postgres
          exit 1

      - name: Start the rest of the stack
        run: docker compose up -d --build

      - name: Migrate
        run: docker compose run --rm backend python manage.py migrate --noinput

      - name: Seed the dedicated E2E admin
        run: |
          docker compose run --rm backend python manage.py shell -c "
          from django.contrib.auth.models import User
          u, _ = User.objects.get_or_create(username='e2e_admin', defaults={'is_staff': True, 'is_superuser': True, 'email': 'e2e@example.com'})
          u.is_staff = u.is_superuser = True
          u.set_password('e2epass123'); u.save()"

      - name: Wait for the stack to answer through nginx
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost/api/v1/settings/ && exit 0
            sleep 2
          done
          echo "stack never became healthy"
          docker compose logs --tail=50
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Playwright e2e
        working-directory: frontend
        run: npx playwright test
