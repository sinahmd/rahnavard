name: Deploy to Production

# Trigger: push to main (auto) OR manual workflow_dispatch
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      rebuild_images:
        description: 'Force rebuild Docker images (no cache)'
        required: false
        default: 'false'
        type: boolean

# Cancel any in-progress deploy when a new one starts
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  deploy:
    name: Deploy to Arvan Cloud
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 30m  # 1 vCPU / 1 GB box: cold builds (npm ci re-runs when --pull refreshes the base image) need more than the old 15m
          script: |
            set -e
            cd /var/www/rahnavard

            echo "🚀 Deployment started — $(date)"

            # Step 0: GitHub SSH pre-flight — ADVISORY ONLY: a failed or hung
            # probe must not abort the deploy, but every command is bounded so
            # it can never hang it either. ConnectTimeout only covers the TCP
            # connect; a stalled SSH handshake on github.com:22 (seen
            # 2026-09-06) needs an outer timeout. BatchMode forbids any
            # interactive prompt (host-key/passphrase) that could block forever.
            echo "🔑 Checking GitHub SSH access..."
            echo "  → ssh-keyscan..."
            if timeout 10 ssh-keyscan -T 5 -H github.com >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "  ✓ ssh-keyscan succeeded"
            else
              echo "  ⚠ ssh-keyscan failed or timed out (advisory)"
            fi
            echo "  → ssh auth probe..."
            if timeout 15 ssh -T -o ConnectTimeout=10 -o BatchMode=yes git@github.com 2>&1 | grep -q "successfully authenticated"; then
              echo "  ✓ GitHub SSH authentication OK"
            else
              echo "  ⚠ GitHub SSH auth probe failed or timed out (advisory) — attempting pull anyway..."
            fi

            # Step 1: Pull latest code (shallow fetch avoids SSH hang on diverged
            # history). The fetch is the first REQUIRED step — bounded at 120s
            # so an SSH stall here fails fast into the existing error handling
            # instead of hanging until the job's 20m limit.
            echo "📥 Pulling code..."
            if ! timeout 120 git fetch --depth 1 origin main 2>&1; then
              echo "❌ git fetch failed (or timed out after 120s) — check that the server's SSH key has repo access"
              echo "   Run: ssh -T git@github.com  (from the server)"
              echo "   If invalid, update the deploy key in GitHub → Settings → Deploy Keys"
              exit 1
            fi
            git reset --hard origin/main
            echo "✅ Code at $(git rev-parse --short HEAD)"

            # Step 2: Build Docker images. --progress=plain streams build
            # output (the 2026-09-05 failure showed zero build output for 15
            # minutes) so a hung step is visible in the Actions log instead of
            # silent. Resource snapshot first: the box is 1 vCPU / 1 GB —
            # disk-full or OOM during build are the silent-hang suspects.
            echo "🖥️  Server resources before build:"
            df -h / || true
            free -m || true
            REBUILD="${{ github.event.inputs.rebuild_images || 'false' }}"
            if [ "$REBUILD" = "true" ]; then
              echo "📦 Building images (no cache)..."
              docker compose -f ${{ env.COMPOSE_FILE }} build --progress=plain --pull --no-cache
            else
              echo "📦 Building images (with cache)..."
              docker compose -f ${{ env.COMPOSE_FILE }} build --progress=plain --pull
            fi
            echo "🖥️  Server resources after build:"
            df -h / || true
            free -m || true

            # Step 3: Run migrations explicitly (idempotent) BEFORE the new code
            # serves traffic. The one-shot container exits with the migrate
            # status; entrypoint.sh still re-runs migrate on backend start as a
            # safety net (migrations are recorded, so a re-run is a no-op).
            echo "🗄️  Running migrations..."
            docker compose -f ${{ env.COMPOSE_FILE }} run --rm --no-deps backend python manage.py migrate --noinput

            # Step 4: Rolling start (NO blind down) — recreate changed containers
            # only, then bounce nginx LAST so it re-resolves the new backend/
            # frontend container IPs (nginx caches upstreams at startup).
            echo "🔄 Starting services..."
            docker compose -f ${{ env.COMPOSE_FILE }} up -d --remove-orphans backend

            echo "🏥 Waiting for backend health..."
            BACKEND_OK=false
            for i in {1..12}; do
              if docker compose -f ${{ env.COMPOSE_FILE }} exec -T backend python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/settings/', timeout=3) else 1)" > /dev/null 2>&1; then
                BACKEND_OK=true
                echo "✅ Backend healthy"
                break
              fi
              echo "   ...waiting (${i}/12)"
              sleep 5
            done
            if [ "$BACKEND_OK" != "true" ]; then
              echo "❌ Backend health check failed"
              docker compose -f ${{ env.COMPOSE_FILE }} logs --tail=40 backend
              exit 1
            fi

            docker compose -f ${{ env.COMPOSE_FILE }} up -d --remove-orphans frontend
            echo "✅ Frontend started"
            # Bounce nginx last so its upstreams point at the recreated containers.
            docker compose -f ${{ env.COMPOSE_FILE }} up -d --force-recreate --no-deps nginx

            # Step 5: End-to-end health through nginx (max 60s)
            echo "🏥 End-to-end health check..."
            SITE_OK=false
            for i in {1..12}; do
              if curl -sf http://localhost/api/v1/settings/ > /dev/null 2>&1; then
                SITE_OK=true
                echo "✅ Site healthy"
                break
              fi
              echo "   ...waiting (${i}/12)"
              sleep 5
            done
            if [ "$SITE_OK" != "true" ]; then
              echo "❌ Site health check failed"
              docker compose -f ${{ env.COMPOSE_FILE }} logs --tail=40 nginx backend
              exit 1
            fi

            # Step 6: Status
            echo "📊 Status:"
            docker compose -f ${{ env.COMPOSE_FILE }} ps
            echo "✅ Done — https://rahnavard.co"
