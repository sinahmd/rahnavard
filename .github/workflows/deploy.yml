name: Deploy to Production

# Trigger: push to main (auto) OR manual workflow_dispatch
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      rebuild_images:
        description: 'Force rebuild Docker images (no cache)'
        required: false
        default: 'false'
        type: boolean

# Cancel any in-progress deploy when a new one starts
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  deploy:
    name: Deploy to Arvan Cloud
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -e
            cd /var/www/rahnavard

            echo "🚀 Deployment started — $(date)"

            # Step 1: Pull latest code (shallow fetch avoids SSH hang on diverged history)
            echo "📥 Pulling code..."
            git fetch --depth 1 origin main
            git reset --hard origin/main
            echo "✅ Code at $(git rev-parse --short HEAD)"

            # Step 2: Build Docker images
            REBUILD="${{ github.event.inputs.rebuild_images || 'false' }}"
            if [ "$REBUILD" = "true" ]; then
              echo "📦 Building images (no cache)..."
              docker compose -f ${{ env.COMPOSE_FILE }} build --pull --no-cache
            else
              echo "📦 Building images (with cache)..."
              docker compose -f ${{ env.COMPOSE_FILE }} build --pull
            fi

            # Step 3: Restart services
            # entrypoint.sh handles: wait for DB → migrate → collectstatic → start Gunicorn
            echo "🔄 Restarting services..."
            docker compose -f ${{ env.COMPOSE_FILE }} down
            docker compose -f ${{ env.COMPOSE_FILE }} up -d

            # Step 4: Health check (max 30s)
            echo "🏥 Health check..."
            for i in {1..6}; do
              if curl -sf http://localhost/api/v1/settings/ > /dev/null 2>&1; then
                echo "✅ Backend healthy"
                break
              fi
              [ $i -eq 6 ] && echo "❌ Backend health check failed" && docker compose -f ${{ env.COMPOSE_FILE }} logs backend | tail -20
              sleep 5
            done

            # Step 5: Status
            echo "📊 Status:"
            docker compose -f ${{ env.COMPOSE_FILE }} ps
            echo "✅ Done — https://rahnavard.co"
